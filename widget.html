const isoWd = d => d.getDay() === 0 ? 7 : d.getDay();
const hm = s => { const p = s.split(':'); return (+p[0])*60 + (+p[1]); };
const pad = n => (n < 10 ? '0' : '') + n;
function render(){

    .filter(c => c.weekday === wd && c.weeks.includes(wk))
    .sort((a,b) => hm(a.start) - hm(b.start));

  if(!list.length){
    box.innerHTML = '<div class="empty">今天没有课,休息一下吧</div>';
  } else {
    box.innerHTML = '<div class="day"><span>' + WK[wd] + ' · 第' + wk + '周</span><span>' + list.length + ' 节课</span></div>' +
      list.map(c => {
        const s = hm(c.start), e = hm(c.end);
        const ing = s <= cur && e > cur;
        const done = e <= cur;
        const cls = ing ? 'it ing' : (done ? 'it done' : 'it');
        const badge = ing ? '<span class="badge">进行中</span>' : '';
        return '<div class="' + cls + '">' +
          '<span class="time">' + c.start + '<small>~' + c.end + '</small></span>' +
          '<span class="nm">' + c.name +
            (c.location ? '<small>' + c.location + (c.teacher ? ' · ' + c.teacher : '') + '</small>' : (c.teacher ? '<small>' + c.teacher + '</small>' : '')) +
          '</span>' + badge + '</div>';
      }).join('');
  }
  const upcoming = list.filter(c => hm(c.end) > cur);
  const nx = document.getElementById('next');
  if(!upcoming.length){
    nx.innerHTML = '今天课程已全部结束 🎉';
  } else {
    const n = upcoming[0], mins = hm(n.start) - cur;
    const inText = mins <= 0 ? '<span class="soon">正在进行</span>'
      : (mins < 60 ? '还有 <b>' + mins + ' 分钟</b>' : '还有 <b>' + Math.floor(mins/60) + ' 小时' + (mins%60 ? ' ' + (mins%60) + ' 分' : '') + '</b>');
    nx.innerHTML = '下一节 ' + n.start + ' ' + n.name + '<br>' + inText;
  }
  document.getElementById('updated').textContent = '更新于 ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' · ' + (COURSES === BUILTIN ? '内置课表' : '同步课表');
}
render();
setInterval(render, 60000);
</script>
</body>
